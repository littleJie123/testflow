<!--
测试用例的结构如下：
{
    "name": "测试用例名称",
    "id":"测试用例id",
    "status": "测试用例状态",// init:初始化，running:运行中，processed:成功，error:失败
    "actions": [  // 可选，测试用例的步骤
        {
            "name": "步骤名称",
            "id": "步骤id",
            "status": "步骤状态"
        }
    ]
}
-->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestLow - 编排你的测试流程</title>
  <link rel="stylesheet" href="css/index.css">
  <script src="js/http.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/util.js"></script>
  <script src="js/marked.min.js"></script>
  <script src="js/mdFile.js"></script>
</head>

<body>
  <div class="layout">
    <div class="menu-container" id="menuContainer"></div>
    <div class="main-content">
      <div class="header">
        <h1>TestLow - 编排你的测试流程</h1>
      </div>
      <div class="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="输入名称或ID搜索..." oninput="handleSearch()">
        <button class="btn" onclick="runAll()">运行所有</button>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>

  <div id="stepModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div class="modal-content-body"></div>
    </div>
  </div>

  <script>

    let testCases = [];
    let filteredTestCases = [];
    let mdFileMeta = {};
    let caseNameById = {};
    let isSearchMode = false;
    let searchTimer = null;
    let http = Http.get()
    http.setClassName('test-case ')
    const urlParams = new URLSearchParams(window.location.search);
    let path = urlParams.get('path') || '';

    function updateUrl() {
      const newUrl = new URL(window.location);
      if (path) {
        newUrl.searchParams.set('path', path);
      } else {
        newUrl.searchParams.delete('path');
      }
      window.history.pushState({ path }, '', newUrl);
    }

    function syncPathFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      path = urlParams.get('path') || '';
    }

    window.addEventListener('popstate', function () {
      syncPathFromUrl();
      fetchData();
    });
    function buildCaseNameMap(list) {
      caseNameById = {};
      for (let item of list) {
        if (item.type !== 'mdFile' && item.type !== 'directory') {
          caseNameById[item.id] = item.name;
        }
      }
    }

    function getMdDisplayName(mdItem) {
      return caseNameById[mdItem.name] || mdItem.name;
    }

    async function fetchData() {
      try {
        const data = await http.post('/listTestCase', { path });
        console.log('获取数据成功:', data);

        mdFileMeta = {};
        testCases = data.list || [];
        isSearchMode = false;
        buildCaseNameMap(testCases);
        handleSearch();
      } catch (error) {
        console.error('获取数据失败:', error);
      }
    }

    function getBasePathFromElement(el) {
      const basePath = el?.closest('.test-case')?.dataset?.basePath;
      if (basePath == null || basePath === '') {
        return path;
      }
      return basePath;
    }

    function isSearchSubDirResult(testCase) {
      if (!isSearchMode) {
        return false;
      }
      const basePath = testCase.basePath ?? '';
      return basePath !== path;
    }

    function getSearchDirName(testCase) {
      const basePath = testCase.basePath ?? '';
      if (!isSearchSubDirResult(testCase)) {
        return '';
      }
      if (path && basePath.startsWith(path + '/')) {
        return basePath.slice(path.length + 1);
      }
      return basePath;
    }

    function buildSearchDirHtml(testCase) {
      const dirName = getSearchDirName(testCase);
      if (!dirName) {
        return '';
      }
      return `<div class="search-dir-label"><span class="search-dir-badge">📂 ${dirName}</span></div>`;
    }

    function getSearchCardClass(testCase) {
      return isSearchSubDirResult(testCase) ? ' search-subdir' : '';
    }

    async function handleSearch() {
      const searchTerm = document.getElementById('searchInput').value.trim();
      if (searchTimer) {
        clearTimeout(searchTimer);
      }
      searchTimer = setTimeout(async () => {
        if (searchTerm === '') {
          isSearchMode = false;
          filteredTestCases = testCases;
          renderTestCases();
          return;
        }
        try {
          const data = await http.post('/listTestCase', { path, keyword: searchTerm });
          isSearchMode = true;
          filteredTestCases = data.list || [];
          buildCaseNameMap(testCases.concat(filteredTestCases));
          renderTestCases();
        } catch (error) {
          console.error('搜索失败:', error);
        }
      }, 200);
    }

    function renderTestCases() {
      const content = document.getElementById('content');
      const casesToRender = filteredTestCases.length > 0 || document.getElementById('searchInput').value ?
        filteredTestCases : testCases;
      let up = ''
      if (path && !isSearchMode) {
        up = `
          <div class="test-case">
              <div class="test-case-content" >
                  <h3>📂 ..</h3>
                  <div>名称: 上一级</div>
              </div>
              <div>
                  <button class="btn" onclick="goUp()">进入</button>
              </div>
          </div>
      `;
      }
      content.innerHTML = up + casesToRender.map(testCase => renderTestCase(testCase)).join('');
    }
    function goUp() {
      const arr = path.split('/')
      arr.pop()
      path = arr.join('/')
      updateUrl()
      fetchData()
    }
    function enterDirectory(id, btn) {
      const parentPath = btn ? getBasePathFromElement(btn) : path;
      if (parentPath) {
        path = parentPath + '/' + id
      } else {
        path = id
      }
      document.getElementById('searchInput').value = '';
      isSearchMode = false;
      updateUrl()
      fetchData()
    }
    function renderTestCase(testCase) {
      const basePathAttr = testCase.basePath != null ? testCase.basePath : path;
      const searchDirHtml = buildSearchDirHtml(testCase);
      const searchClass = getSearchCardClass(testCase);
      if (testCase.type === 'mdFile') {
        mdFileMeta[testCase.id] = testCase;
        const displayName = getMdDisplayName(testCase);
        return `
          <div class="test-case init action-item-md${searchClass}" id="${testCase.id}" data-base-path="${basePathAttr}">
              <div class="test-case-content">
                  ${searchDirHtml}
                  <h3><span class="md-badge">MD</span> ${displayName}</h3>
                  <div>文件: ${testCase.name}.md</div>
              </div>
              <div>
                  <button class="btn" onclick="showMdFile('${testCase.id}')">查看</button>
              </div>
          </div>
      `;
      }
      if (testCase.type === 'directory') {
        return `
          <div class="test-case${searchClass}" id="${testCase.id}" data-base-path="${basePathAttr}">
              <div class="test-case-content" >
                  ${searchDirHtml}
                  <h3>📂 ${testCase.name}</h3>
                  <div>ID: ${Util.getId(testCase.id)}</div>
              </div>
              <div>
                  <button class="btn" onclick="enterDirectory('${testCase.id}', this)">进入</button>
              </div>
          </div>
      `;
      }
      return `
                <div class="test-case ${testCase.status}${searchClass}" id="${testCase.id}" data-base-path="${basePathAttr}">
                    <div class="test-case-content" >
                        ${searchDirHtml}
                        <h3>${testCase.name}</h3>
                        <div>ID: ${Util.getId(testCase.id)}</div>
                        <div>状态: ${Util.getStatusText(testCase.status)}</div>
                    </div>
                    <div>
                        <button class="btn" onclick="show('${testCase.id}', this)">查看</button>
                        <button class="btn" onclick="runTestCase('${testCase.id}', this)">运行</button>
                    </div>
                </div>
            `;
    }
    function show(id, btn) {
      const casePath = btn ? getBasePathFromElement(btn) : path;
      let param = escape(`${casePath ? casePath + '/' : ''}${id}`)
      window.open(`/detail.html?id=${param}`, '_test');
    }

    function showMdFile(id) {
      MdFileView.open(mdFileMeta[id]);
    }



    function toggleActions(element) {
      const testCase = element.closest('.test-case');
      testCase.classList.toggle('expanded');
    }



    function closeModal() {
      document.getElementById('logModal').style.display = 'none';
    }

    function toggleStack(element) {
      if (element.querySelector('.log-stack')) {
        element.classList.toggle('expanded');
      }
    }

    async function runTestCase(id, btn) {
      try {
        const casePath = btn ? getBasePathFromElement(btn) : path;
        const response = await http.post('/runTestCase', {
          id: id,
          path: casePath

        });


      } catch (error) {
        console.error('运行测试用例失败:', error);
      }
    }





    async function runAll() {
      let cases = filteredTestCases.filter(row => row.type != 'directory' && row.type != 'mdFile')
      try {
        for (let testCase of cases) {
          const casePath = testCase.basePath != null ? testCase.basePath : path;
          await http.post('/runTestCase', {
            id: testCase.id,
            path: casePath,
          });
        }
      } catch (error) {
        console.error('运行测试用例失败:', error);
      }
    }

    // 初始加载
    fetchData();


  </script>
</body>

</html>
